<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Vehicle Lab · 台北车辆测试场</title>
<style>
  :root{color-scheme:dark;--bg:#0b0c0e;--panel:#121417;--ink:#f2f0e9;--muted:#9b9da3;--line:#2a2d31;--accent:#df3038}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
  button,input{font:inherit}
  button{color:inherit}
  #renderer-host{position:fixed;inset:0}
  #renderer-host canvas{display:block;width:100%;height:100%;outline:none}
  .topbar{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:22px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
  .brand{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
  .brand strong{font-size:21px;letter-spacing:.08em}
  .brand span{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .top-stats{display:flex;gap:18px;font-size:12px;color:var(--muted)}
  .top-stats b{color:var(--ink);font-size:15px;margin-right:4px}
  .top-actions{margin-left:auto;display:flex;gap:8px}
  .tool-button,.filter-button,.reset-button{cursor:pointer;border:1px solid var(--line);background:transparent;padding:8px 12px;font-size:12px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s}
  .tool-button:hover,.filter-button:hover,.reset-button:hover{background:#202328;border-color:#555b63;transform:translateY(-2px)}
  .tool-button:active,.filter-button:active,.reset-button:active{transform:scale(.96)}
  .tool-button{text-decoration:none;color:var(--ink)}
  #fleet-panel{position:fixed;z-index:4;left:0;top:64px;bottom:0;width:328px;background:rgba(18,20,23,.97);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s ease}
  #fleet-panel.closed{transform:translateX(-100%)}
  .fleet-tools{padding:18px 18px 12px}
  #fleet-search{width:100%;border:0;border-bottom:1px solid #484c52;background:transparent;color:var(--ink);padding:10px 2px;outline:none}
  #fleet-search:focus{border-color:var(--accent)}
  #fleet-search::placeholder{color:#777c83}
  #fleet-filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .filter-button{padding:6px 9px;color:var(--muted)}
  .filter-button.active{background:var(--ink);color:#111;border-color:var(--ink)}
  .fleet-caption{display:flex;justify-content:space-between;padding:10px 18px;color:var(--muted);font-size:11px;letter-spacing:.08em}
  #fleet-list{overflow-y:auto;overscroll-behavior:contain;padding:0 10px 18px;scrollbar-width:thin;scrollbar-color:#4a4e54 transparent}
  .vehicle-item{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;padding:12px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s}
  .vehicle-item:hover{background:#1d2024;transform:translateX(3px)}
  .vehicle-item:active{transform:scale(.985)}
  .vehicle-item.selected{background:#23262b;border-left-color:var(--accent)}
  .vehicle-item.pending{opacity:.45;cursor:wait}
  .vehicle-item[hidden]{display:none}
  .vehicle-item .name{font-size:14px;font-weight:700}
  .vehicle-item .kind{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .vehicle-item .id{grid-column:1/-1;color:#858a91;font:11px/1.3 Consolas,monospace;overflow:hidden;text-overflow:ellipsis}
  #spec-panel{position:fixed;right:24px;top:88px;z-index:3;width:260px;text-align:right;pointer-events:none;text-shadow:0 2px 8px #000}
  #vehicle-name{font-size:27px;line-height:1.15;margin:0}
  #vehicle-id{color:#b8bcc2;font:12px/1.5 Consolas,monospace;margin:7px 0 14px;word-break:break-all}
  #vehicle-specs{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:12px;color:#c4c7cb}
  #vehicle-specs b{color:#fff;font-weight:600}
  #drive-hud{position:fixed;right:26px;bottom:28px;z-index:3;text-align:right;pointer-events:none;text-shadow:0 2px 10px #000}
  #speed-value{font:600 72px/.85 "Bahnschrift","DIN Condensed",sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  #speed-unit{font-size:12px;letter-spacing:.2em;color:#c4c7cb;margin-top:8px}
  #drive-state{font-size:12px;color:#d7d9dc;margin-top:10px}
  #controls-help{position:fixed;left:352px;bottom:26px;z-index:3;color:#d0d2d5;font-size:12px;line-height:1.8;pointer-events:none;text-shadow:0 2px 6px #000}
  #controls-help kbd{display:inline-block;min-width:24px;padding:0 5px;margin:0 2px;text-align:center;background:#191b1f;border:1px solid #4b4f55;color:#fff;font:11px/20px Consolas,monospace}
  #loading{position:fixed;inset:64px 0 0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0b0c0e;transition:opacity .35s ease}
  #loading.done{opacity:0;pointer-events:none}
  .loading-inner{width:min(420px,72vw)}
  .loading-title{font-size:24px;font-weight:800;letter-spacing:.06em}
  #loading-text{margin-top:10px;color:var(--muted);font-size:13px}
  .loading-track{height:3px;background:#2b2e32;margin-top:22px;overflow:hidden}
  #loading-bar{height:100%;width:2%;background:var(--accent);transition:width .2s ease}
  #error-box{display:none;position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:20;background:#42191c;border-left:4px solid #ff4d55;padding:12px 18px;max-width:70vw;font-size:13px}
  @media(max-width:900px){
    .topbar{padding:0 14px;gap:12px}.top-stats{display:none}.brand span{display:none}
    #fleet-panel{width:280px}#controls-help{left:24px;bottom:18px;max-width:55vw}
    #spec-panel{right:16px;width:210px}#vehicle-name{font-size:21px}
  }
  @media(max-width:620px){
    #spec-panel{display:none}#fleet-panel{width:min(82vw,310px)}
    #drive-hud{right:16px;bottom:18px}#speed-value{font-size:54px}
    #controls-help{display:none}.top-actions{gap:4px}.tool-button{padding:7px 9px}
  }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="renderer-host"></div>
<header class="topbar">
  <div class="brand"><strong>VEHICLE LAB</strong><span>TAIPEI RUSH / THREE.JS</span></div>
  <div class="top-stats"><span><b id="fleet-count">0</b>车辆配置</span><span><b>19</b>高精度模型</span></div>
  <div class="top-actions">
    <button class="tool-button" id="fleet-toggle" type="button">车辆目录</button>
    <button class="tool-button" id="camera-button" type="button">重置视角</button>
    <a class="tool-button" href="/index.html">校园页</a>
  </div>
</header>
<aside id="fleet-panel">
  <div class="fleet-tools">
    <input id="fleet-search" type="search" placeholder="搜索车型或 ID" autocomplete="off">
    <div id="fleet-filters">
      <button class="filter-button active" data-filter="all" type="button">全部</button>
      <button class="filter-button" data-filter="base" type="button">基础</button>
      <button class="filter-button" data-filter="detail" type="button">高精度</button>
      <button class="filter-button" data-filter="custom" type="button">改装</button>
      <button class="filter-button" data-filter="player" type="button">玩家配置</button>
    </div>
  </div>
  <div class="fleet-caption"><span>选择车辆开始测试</span><span id="visible-count"></span></div>
  <div id="fleet-list"></div>
</aside>
<section id="spec-panel">
  <h1 id="vehicle-name">載入中</h1>
  <div id="vehicle-id">—</div>
  <div id="vehicle-specs"></div>
</section>
<div id="drive-hud">
  <div id="speed-value">0</div>
  <div id="speed-unit">KM/H</div>
  <div id="drive-state">待命</div>
</div>
<div id="controls-help">
  <div><kbd>W</kbd><kbd>S</kbd> 油门 / 制动与倒车　<kbd>A</kbd><kbd>D</kbd> 转向</div>
  <div><kbd>Space</kbd> 手刹　<kbd>R</kbd> 复位　鼠标拖动旋转视角，滚轮缩放</div>
</div>
<button id="reset-button" class="reset-button" type="button" style="position:fixed;right:26px;bottom:142px;z-index:4">车辆复位</button>
<div id="loading">
  <div class="loading-inner">
    <div class="loading-title">VEHICLE LAB</div>
    <div id="loading-text">准备车辆测试场</div>
    <div class="loading-track"><div id="loading-bar"></div></div>
  </div>
</div>
<div id="error-box" role="alert"></div>
<script type="module" src="/src/vehicle-main.js"></script>
</body>
</html>
