<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1v1 对决</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0f12}canvas{display:block}
  #gun-hud,#gun-hint,#gun-menu,#crosshair,#awp-scope,#game-loader{font-family:"Microsoft JhengHei","Noto Sans SC",system-ui,sans-serif;color:#f4f1ea}
  #gun-hint[hidden],#gun-hud[hidden],#gun-menu[hidden],#crosshair[hidden],#awp-scope[hidden],#hit-marker[hidden],#ladder-hint[hidden]{display:none!important}
  #gun-hud{position:fixed;inset:0;z-index:20;pointer-events:none;text-shadow:0 2px 8px #000}#weapon-name,#weapon-state{display:none!important}
  #room-label{position:absolute;left:26px;top:24px;color:#a8adb3;font-size:12px;letter-spacing:.08em}
  #duel-score{position:absolute;right:26px;top:24px;text-align:right;font:600 34px/1 "Bahnschrift",sans-serif}#duel-score small{display:block;margin-top:7px;color:#a8adb3;font:11px system-ui,sans-serif;letter-spacing:.12em}
  #player-hp{position:absolute;left:26px;bottom:62px;font:600 42px/1 "Bahnschrift",sans-serif}#player-hp small{margin-left:6px;color:#a8adb3;font:11px system-ui,sans-serif}
  #ammo-count{position:absolute;right:28px;bottom:24px;font:600 54px/1 "Bahnschrift",sans-serif;font-variant-numeric:tabular-nums}
  #gun-help{position:absolute;left:26px;bottom:26px;color:#d5d7da;font-size:12px;line-height:2}
  #duel-message{position:absolute;left:50%;top:29%;transform:translateX(-50%);font-size:19px;letter-spacing:.08em;text-align:center;white-space:nowrap}
  #ladder-hint{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);padding:8px 12px;background:rgba(12,14,16,.8);border-left:2px solid #f3c873;color:#f3c873;font-size:12px;white-space:nowrap}
  #hit-marker{position:fixed;left:50%;top:50%;z-index:22;transform:translate(-50%,-50%);color:#f3c873;font:34px/1 Arial,sans-serif}#hit-marker.kill{color:#df3038}
  #damage-flash{position:fixed;inset:0;z-index:19;pointer-events:none;background:rgba(223,48,56,.2);opacity:0;transition:opacity .22s}
  #gun-hint{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);z-index:30;padding:12px 18px;background:rgba(12,14,16,.88);border-left:3px solid #df3038;font-size:13px;pointer-events:none;white-space:nowrap}
  #gun-menu{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(5,6,8,.82)}
  .gun-dialog{display:flex;flex-direction:column;width:min(960px,94vw);max-height:86vh;background:#121417;border-top:3px solid #df3038;box-shadow:0 18px 70px rgba(0,0,0,.45)}
  .gun-dialog-head{display:flex;align-items:center;padding:20px 22px 14px;gap:14px}.gun-dialog-head h2{margin:0;font-size:24px}.gun-dialog-head span{color:#92979e;font-size:12px}
  #gun-menu-close{margin-left:auto;padding:7px 12px;border:1px solid #3b4046;background:transparent;color:#fff;cursor:pointer}
  #gun-menu-body{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:360px;overflow:hidden}
  #gun-list{display:grid;grid-template-columns:1fr;gap:5px;align-content:start;max-height:58vh;overflow-y:auto;padding:0 0 16px 16px}
  .weapon-option{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-left:3px solid transparent;background:#1a1d21;color:#f4f1ea;text-align:left;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s}.weapon-option:hover{background:#272b30;transform:translateX(2px)}.weapon-option:active{transform:scale(.985)}.weapon-option.selected{border-left-color:#df3038;background:#2b2426}
  .drive-kind{color:#92979e;font-size:10px}.drive-id{grid-column:1/-1;color:#8d9299;font:11px Consolas,monospace}
  .gun-preview-panel{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:12px 24px 22px;background:#171a1e}#gun-preview{width:100%;height:270px}#gun-preview-name{font-size:22px;font-weight:750}#gun-preview-meta{margin-top:7px;color:#a8adb3;font-size:12px}
  #crosshair{position:fixed;left:50%;top:50%;z-index:21;width:24px;height:24px;transform:translate(-50%,-50%);pointer-events:none}#crosshair i{position:absolute;background:rgba(255,255,255,.92);box-shadow:0 0 2px #000}#crosshair i:nth-child(1){width:6px;height:1px;left:0;top:11px}#crosshair i:nth-child(2){width:6px;height:1px;right:0;top:11px}#crosshair i:nth-child(3){width:1px;height:6px;left:11px;top:0}#crosshair i:nth-child(4){width:1px;height:6px;left:11px;bottom:0}
  #awp-scope{position:fixed;inset:0;z-index:24;pointer-events:none;overflow:hidden}.scope-circle{position:absolute;left:50%;top:50%;width:72vmin;height:72vmin;transform:translate(-50%,-50%);border:2px solid #090a0b;border-radius:50%;box-shadow:0 0 0 100vmax #000}.scope-h,.scope-v{position:absolute;left:50%;top:50%;background:rgba(10,10,10,.82);transform:translate(-50%,-50%)}.scope-h{width:72vmin;height:1px}.scope-v{width:1px;height:72vmin}.scope-dot{position:absolute;left:50%;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);background:#111;border-radius:50%}
  #game-loader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0d0f12;transition:opacity .4s ease,visibility .4s}#game-loader.done{opacity:0;visibility:hidden;pointer-events:none}.loader-content{width:min(420px,76vw)}
  .loader-mark{display:flex;align-items:center;gap:6px;height:34px;margin-bottom:26px}.loader-mark i{display:block;width:7px;height:30px;background:#df3038;animation:loader-pulse 1s ease-in-out infinite}.loader-mark i:nth-child(2){animation-delay:.1s}.loader-mark i:nth-child(3){animation-delay:.2s}.loader-mark i:nth-child(4){animation-delay:.3s}.loader-mark i:nth-child(5){animation-delay:.4s}
  #loader-title{margin-bottom:14px;font-size:25px;font-weight:700;letter-spacing:.12em}.loader-row{display:flex;justify-content:space-between;gap:20px;margin-bottom:12px;color:#a8adb3;font-size:12px}#loader-progress{color:#f4f1ea;font:14px Consolas,monospace}.loader-track{height:2px;background:#30343a;overflow:hidden}#loader-bar{width:0;height:100%;background:#df3038;transition:width .2s ease}#game-loader.failed .loader-mark i{animation:none;opacity:.35;transform:scaleY(.4)}#game-loader.failed #loader-status{color:#ff8b8f;line-height:1.7}
  @keyframes loader-pulse{0%,100%{opacity:.35;transform:scaleY(.35)}50%{opacity:1;transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.loader-mark i{animation:none}#game-loader,#loader-bar{transition:none}}
  @media(max-width:760px){#ammo-count{font-size:42px}#gun-help{display:none}.gun-dialog{max-height:92vh}#gun-menu-body{grid-template-columns:1fr;min-height:0;overflow-y:auto}.gun-preview-panel{order:-1;padding:4px 18px 12px}#gun-preview{height:170px}#gun-list{max-height:none;padding:0 12px 14px;overflow:visible}}
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="game-loader" role="status" aria-live="polite"><div class="loader-content"><div class="loader-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div id="loader-title">正在准备 1v1 对决</div><div class="loader-row"><span id="loader-status">搭建对称战场</span><span id="loader-progress">0%</span></div><div class="loader-track"><div id="loader-bar"></div></div></div></div>
<div id="damage-flash"></div>
<div id="gun-hud">
  <div id="weapon-name">M4A4</div><div id="weapon-state">全自动</div>
  <div id="room-label">房间</div><div id="duel-score">0 : 0<small>击杀 / 阵亡</small></div>
  <div id="player-hp">100<small>HP</small></div><div id="ammo-count">30 / 90</div>
  <div id="duel-message">连接对战服务器</div><div id="ladder-hint" hidden>W / S 攀爬 · Space 跳下</div><div id="hit-marker" hidden>×</div>
  <div id="gun-help">WASD 移动　Shift 疾跑　Space 跳跃　Ctrl / C 下蹲</div>
</div>
<div id="gun-menu" hidden><section class="gun-dialog" aria-label="枪械选单"><div class="gun-dialog-head"><h2>选择枪械</h2><span>7 把枪械 · 按 B 关闭</span><button id="gun-menu-close" type="button">关闭</button></div><div id="gun-menu-body"><div id="gun-list"></div><div class="gun-preview-panel"><canvas id="gun-preview" aria-label="枪械三维模型预览"></canvas><div id="gun-preview-name">M4A4</div><div id="gun-preview-meta">全自动 · 弹匣 30 发</div></div></div></section></div>
<div id="gun-hint">点击画面锁定鼠标 · 左键射击 · B 选枪 · 靠近梯子按 W / S</div>
<div id="crosshair"><i></i><i></i><i></i><i></i></div><div id="awp-scope" hidden><div class="scope-circle"></div><div class="scope-h"></div><div class="scope-v"></div><div class="scope-dot"></div></div>
<script type="module" src="/duel/main.js"></script>
</body>
</html>
